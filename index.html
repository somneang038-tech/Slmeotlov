<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Do You Love Me?</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
      position: relative;
    }

    h1 {
      color: #ff4b2b;
      margin-bottom: 30px;
      font-size: 2rem;
    }

    .btn-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      position: relative;
      min-height: 60px;
    }

    button {
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    #yesBtn {
      background-color: #ff416c;
      color: white;
    }

    #yesBtn:hover {
      background-color: #ff4b2b;
      transform: scale(1.05);
    }

    #noBtn {
      background-color: #e0e0e0;
      color: #333;
      position: absolute;
      right: 40px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Do you love me? </h1>
    <div class="btn-container">
      <button id="yesBtn" onclick="acceptLove()">Yes</button>
      <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()"> No</button>
    </div>
  </div>

  <script>
    // Redirect to YouTube link when 'Yes' is clicked
    function acceptLove() {
      window.location.href = "https://youtu.be/nMs56EzuYiU?si=XpOM8HOGGdiUcZay";
    }

    // Move the 'No' button to a random position when hovered or clicked
    function moveButton() {
      const noBtn = document.getElementById("noBtn");
      
      // Calculate random positions within the browser viewport
      const x = Math.floor(Math.random() * (window.innerWidth - noBtn.offsetWidth - 50));
      const y = Math.floor(Math.random() * (window.innerHeight - noBtn.offsetHeight - 50));

      noBtn.style.position = "fixed";
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    }
  </script>

</body>
</html>
